name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo Hygiene (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Show toolchain
        run: |
          python3 --version
          systemd-analyze --version || true

      - name: Python syntax
        run: |
          python3 -m py_compile hailo-openai-proxy/proxy.py
          rm -rf hailo-openai-proxy/__pycache__

      - name: pyproject syntax
        run: python3 -c 'import tomllib; tomllib.load(open("pyproject.toml", "rb"))'

      - name: Shell syntax
        run: |
          bash -n scripts/validate-current-package-versions.sh

      - name: systemd syntax
        run: systemd-analyze verify systemd/hailo-ollama-serve.service systemd/hailo-openai-proxy.service

      - name: Makefile dry run
        run: make -n help python proxy-run systemd-install leather-validate leather-canary leather-digest leather-ingest

      - name: Generated-file guard
        run: |
          test ! -d .venv
          test ! -d hailo-openai-proxy/__pycache__
          test ! -f hailo-openai-proxy/hailort.log
